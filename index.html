<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>نتيجة مدرسة الثغر الرسمية لغات</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');
body{
font-family:'Cairo',Arial,sans-serif;
background:linear-gradient(135deg,#eef4ff,#f8fbff);
margin:0;
padding:30px;
}
.container{
max-width:900px;
margin:auto;
background:#fff;
padding:30px;
border-radius:18px;
box-shadow:0 8px 25px rgba(0,0,0,.12);
}
h2{
text-align:center;
color:#0d47a1;
margin-bottom:10px;
}
.credit{
text-align:center;
background:#e8f0fe;
padding:10px;
border-radius:10px;
font-weight:bold;
color:#1565c0;
margin-bottom:20px;
}
input{
width:70%;
padding:12px;
border:1px solid #cfd8dc;
border-radius:10px;
font-size:16px;
}
button{
padding:12px 24px;
background:#1565c0;
color:white;
border:none;
border-radius:10px;
font-size:16px;
cursor:pointer;
}
button:hover{opacity:.9}
table{
border-collapse:collapse;
width:100%;
margin-top:20px;
overflow:hidden;
border-radius:12px;
}
th{
background:#1565c0;
color:white;
width:35%;
}
td,th{
border:1px solid #ddd;
padding:10px;
}
tr:nth-child(even){background:#f7f9fc}
#out{margin-top:20px}
</style>

</head>
<body><div class='container'>
<h2>نتيجة مدرسة الثغر الرسمية لغات</h2>
<div class='credit'>إعداد وتصميم أ/ مصطفى صبره</div>

<p>أدخل الرقم القومي:</p>
<input id="nid" type="text">
<button onclick="search()">بحث</button>
<div id="out"></div>

<script>
let data=[];
fetch('students_results.json').then(r=>r.json()).then(j=>data=j);

function search(){
 const v=document.getElementById('nid').value.trim();
 const out=document.getElementById('out');
 const col="الرقم القومى";
 const s=data.find(x=>String(x[col]).trim()===v);
 if(!s){out.innerHTML='<p>لم يتم العثور على الطالب</p>';return;}
 let html='<table>';
 for(const k in s) html += `<tr><th>${k}</th><td>${s[k]}</td></tr>`;
 html+='</table>';
 out.innerHTML=html;
}
</script>
</div></body>
</html>
