<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>نتيجة مدرسة الثغر الرسمية لغات</title>
<style>
body{font-family:Arial;margin:40px;max-width:900px}
input,button{padding:10px;font-size:16px}
table{border-collapse:collapse;width:100%;margin-top:20px}
td,th{border:1px solid #ccc;padding:8px}
</style>
</head>
<body>
<h2>نتيجة مدرسة الثغر الرسمية لغات</h2>
<div style="margin-top:10px;padding:8px;background:#f3f3f3;border-radius:8px;text-align:center">
<b>إعداد وتصميم أ/ مصطفى صبره</b>
</div>

<p>أدخل الرقم القومي:</p>
<input id="nid" type="text">
<button onclick="search()">بحث</button>
<div id="out"></div>

<script>
let data=[];
fetch('students_results.json').then(r=>r.json()).then(j=>data=j);

function search(){
 const v=document.getElementById('nid').value.trim();
 const out=document.getElementById('out');
 const col="الرقم القومى";
 const s=data.find(x=>String(x[col]).trim()===v);
 if(!s){out.innerHTML='<p>لم يتم العثور على الطالب</p>';return;}
 let html='<table>';
 for(const k in s) html += `<tr><th>${k}</th><td>${s[k]}</td></tr>`;
 html+='</table>';
 out.innerHTML=html;
}
</script>
</body>
</html>
