<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نتيجة آخر العام 2026 - الثغر الرسمية للغات</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #c9a84c;
    --gold-light: #e8c96a;
    --gold-dark: #8a6b1e;
    --deep-navy: #0a1628;
    --navy: #112240;
    --navy-mid: #1a3355;
    --navy-light: #223d6e;
    --white: #f8f4ec;
    --cream: #fdf6e3;
    --success: #2ecc71;
    --fail: #e74c3c;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Cairo', sans-serif;
    background: var(--deep-navy);
    min-height: 100vh;
    color: var(--white);
    overflow-x: hidden;
  }

  /* Animated star background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(1px 1px at 20% 30%, rgba(201,168,76,0.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 60% 70%, rgba(201,168,76,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 80% 20%, rgba(255,255,255,0.2) 0%, transparent 100%),
      radial-gradient(2px 2px at 40% 80%, rgba(201,168,76,0.2) 0%, transparent 100%),
      radial-gradient(1px 1px at 90% 50%, rgba(255,255,255,0.15) 0%, transparent 100%);
    pointer-events: none;
    z-index: 0;
  }

  .page-wrapper {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 16px 40px;
  }

  /* Header */
  .header {
    width: 100%;
    max-width: 860px;
    text-align: center;
    padding: 30px 20px 20px;
    position: relative;
  }

  .school-name {
    font-family: 'Amiri', serif;
    font-size: clamp(18px, 3vw, 24px);
    color: var(--gold);
    letter-spacing: 1px;
    margin-bottom: 8px;
    opacity: 0.85;
  }

  .ornament {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin: 10px 0;
  }

  .ornament-line {
    height: 1px;
    width: 80px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }

  .ornament-diamond {
    width: 8px; height: 8px;
    background: var(--gold);
    transform: rotate(45deg);
  }

  .main-title {
    font-family: 'Cairo', sans-serif;
    font-size: clamp(28px, 6vw, 52px);
    font-weight: 900;
    background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold) 40%, var(--gold-dark) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1.2;
    margin: 8px 0;
    text-shadow: none;
    filter: drop-shadow(0 0 20px rgba(201,168,76,0.3));
  }

  .year-badge {
    display: inline-block;
    background: linear-gradient(135deg, var(--gold-dark), var(--gold));
    color: var(--deep-navy);
    font-size: clamp(14px, 2.5vw, 18px);
    font-weight: 700;
    padding: 4px 24px;
    border-radius: 30px;
    margin: 8px 0 16px;
    letter-spacing: 2px;
  }

  /* Search card */
  .search-card {
    width: 100%;
    max-width: 560px;
    background: linear-gradient(145deg, rgba(17,34,64,0.95), rgba(26,51,85,0.9));
    border: 1px solid rgba(201,168,76,0.3);
    border-radius: 20px;
    padding: 32px 28px;
    box-shadow:
      0 20px 60px rgba(0,0,0,0.5),
      0 0 0 1px rgba(201,168,76,0.1),
      inset 0 1px 0 rgba(201,168,76,0.2);
    margin: 10px 0 24px;
    animation: fadeInUp 0.6s ease;
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(30px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .search-label {
    display: block;
    font-size: 15px;
    font-weight: 600;
    color: var(--gold-light);
    margin-bottom: 12px;
    text-align: center;
  }

  .input-wrap {
    position: relative;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .id-input {
    flex: 1;
    background: rgba(255,255,255,0.05);
    border: 2px solid rgba(201,168,76,0.3);
    border-radius: 12px;
    padding: 14px 18px;
    font-family: 'Cairo', sans-serif;
    font-size: 18px;
    font-weight: 600;
    color: var(--white);
    text-align: center;
    letter-spacing: 3px;
    outline: none;
    transition: border-color 0.3s, box-shadow 0.3s;
    direction: ltr;
  }

  .id-input::placeholder {
    color: rgba(248,244,236,0.3);
    letter-spacing: 1px;
    font-size: 14px;
  }

  .id-input:focus {
    border-color: var(--gold);
    box-shadow: 0 0 0 3px rgba(201,168,76,0.15), 0 0 20px rgba(201,168,76,0.1);
    background: rgba(255,255,255,0.08);
  }

  .search-btn {
    background: linear-gradient(135deg, var(--gold-dark), var(--gold));
    color: var(--deep-navy);
    border: none;
    border-radius: 12px;
    padding: 14px 22px;
    font-family: 'Cairo', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
    white-space: nowrap;
    box-shadow: 0 4px 15px rgba(201,168,76,0.3);
  }

  .search-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(201,168,76,0.4);
  }

  .search-btn:active { transform: translateY(0); }

  .error-msg {
    margin-top: 12px;
    text-align: center;
    color: #ff6b6b;
    font-size: 14px;
    font-weight: 600;
    display: none;
    animation: shake 0.4s ease;
  }

  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-8px); }
    75% { transform: translateX(8px); }
  }

  /* Result area */
  #result-area {
    width: 100%;
    max-width: 860px;
    display: none;
    animation: fadeInUp 0.5s ease;
  }

  .result-card {
    background: linear-gradient(145deg, rgba(17,34,64,0.98), rgba(10,22,40,0.95));
    border: 1px solid rgba(201,168,76,0.4);
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 25px 70px rgba(0,0,0,0.6), 0 0 0 1px rgba(201,168,76,0.1);
  }

  .result-header {
    background: linear-gradient(135deg, var(--gold-dark) 0%, var(--gold) 50%, var(--gold-light) 100%);
    padding: 20px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }

  .student-name-result {
    font-size: clamp(16px, 3vw, 22px);
    font-weight: 900;
    color: var(--deep-navy);
    font-family: 'Amiri', serif;
  }

  .result-badge {
    font-size: clamp(14px, 2.5vw, 18px);
    font-weight: 900;
    padding: 6px 20px;
    border-radius: 25px;
    letter-spacing: 1px;
    border: 2px solid var(--deep-navy);
  }

  .badge-pass {
    background: var(--deep-navy);
    color: var(--success);
  }

  .badge-fail {
    background: var(--deep-navy);
    color: var(--fail);
  }

  .result-body {
    padding: 20px 24px;
  }

  /* Info grid */
  .info-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
    margin-bottom: 20px;
  }

  .info-item {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(201,168,76,0.15);
    border-radius: 10px;
    padding: 12px 14px;
  }

  .info-label {
    font-size: 11px;
    color: var(--gold);
    font-weight: 600;
    margin-bottom: 4px;
    opacity: 0.8;
  }

  .info-value {
    font-size: 15px;
    font-weight: 700;
    color: var(--white);
  }

  /* Grades table */
  .section-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--gold);
    letter-spacing: 1px;
    margin: 16px 0 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .section-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, rgba(201,168,76,0.4), transparent);
  }

  .grades-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 10px;
    margin-bottom: 16px;
  }

  .grade-item {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(201,168,76,0.12);
    border-radius: 10px;
    padding: 10px 12px;
    transition: border-color 0.2s, background 0.2s;
  }

  .grade-item:hover {
    border-color: rgba(201,168,76,0.35);
    background: rgba(201,168,76,0.05);
  }

  .grade-subject {
    font-size: 11px;
    color: rgba(248,244,236,0.6);
    margin-bottom: 5px;
    line-height: 1.3;
  }

  .grade-score {
    font-size: 20px;
    font-weight: 900;
    color: var(--gold-light);
    font-family: 'Cairo', sans-serif;
    direction: ltr;
  }

  /* Total */
  .total-row {
    background: linear-gradient(135deg, rgba(201,168,76,0.15), rgba(201,168,76,0.05));
    border: 1px solid rgba(201,168,76,0.4);
    border-radius: 12px;
    padding: 14px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 14px 0;
  }

  .total-label {
    font-size: 15px;
    font-weight: 700;
    color: var(--gold-light);
  }

  .total-value {
    font-size: 28px;
    font-weight: 900;
    color: var(--gold);
    font-family: 'Cairo', sans-serif;
    direction: ltr;
  }

  /* Note */
  .note-box {
    background: rgba(255,200,0,0.05);
    border: 1px solid rgba(255,200,0,0.2);
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 13px;
    color: rgba(255,220,100,0.9);
    text-align: center;
    line-height: 1.7;
    margin-top: 14px;
  }

  /* Officials row */
  .officials-row {
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    padding-top: 14px;
    border-top: 1px solid rgba(201,168,76,0.15);
    margin-top: 14px;
  }

  .official-item {
    font-size: 12px;
    color: rgba(248,244,236,0.6);
  }

  .official-item span {
    color: var(--gold);
    font-weight: 600;
  }

  /* Footer */
  .footer {
    margin-top: auto;
    padding-top: 30px;
    text-align: center;
  }

  .footer-content {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }

  .footer-ornament {
    display: flex;
    align-items: center;
    gap: 10px;
    color: rgba(201,168,76,0.4);
    font-size: 10px;
    margin-bottom: 4px;
  }

  .footer-ornament::before,
  .footer-ornament::after {
    content: '◆';
    font-size: 6px;
  }

  .footer-text {
    font-size: 13px;
    color: rgba(201,168,76,0.7);
    font-weight: 600;
    letter-spacing: 1px;
  }

  .footer-phone {
    font-size: 12px;
    color: rgba(248,244,236,0.4);
    direction: ltr;
  }

  @media (max-width: 480px) {
    .search-card { padding: 22px 18px; }
    .result-header { padding: 16px 18px; }
    .result-body { padding: 16px; }
    .grades-grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>

<div class="page-wrapper">

  <header class="header">
    <div class="school-name">مدرسة الثغر الرسمية للغات الإعدادية</div>
    <div class="ornament">
      <div class="ornament-line"></div>
      <div class="ornament-diamond"></div>
      <div class="ornament-line"></div>

  </div>

  <div id="result-area"></div>

  <footer class="footer">
    <div class="footer-content">
      <div class="footer-ornament">تصميم وإعداد</div>
      <div class="footer-text">أ / مصطفى صبره</div>

    </div>
  </footer>

</div>

const lookup = {};
STUDENTS.forEach(s => {
  const id = (s['الرقم القومى'] || '').trim();
  if (id) lookup[id] = s;
});

function searchStudent() {
  const input = document.getElementById('nationalId').value.trim();
  const errMsg = document.getElementById('errorMsg');
  const resultArea = document.getElementById('result-area');

  errMsg.style.display = 'none';
  resultArea.style.display = 'none';

  if (!input) {
    errMsg.textContent = '⚠️ يرجى إدخال الرقم القومي أولاً';
    errMsg.style.display = 'block';
    return;
  }

  const student = lookup[input];
  if (!student) {
    errMsg.textContent = '❌ الرقم القومي غير موجود، يرجى التحقق والمحاولة مجدداً';
    errMsg.style.display = 'block';
    errMsg.style.animation = 'none';
    void errMsg.offsetWidth;
    errMsg.style.animation = 'shake 0.4s ease';
    return;
  }

  renderResult(student);
}

function renderResult(s) {
  const isPass = (s['النتيجة'] || '').trim() === 'ناجح';

  const subjectCols = [
    {'key': '(80) لغة عربية ', 'label': 'لغة عربية', 'max': 80},
    {'key': '  (60) لغة اجنبية اولى', 'label': 'لغة أجنبية أولى', 'max': 60},
    {'key': '(40) دراسات', 'label': 'دراسات اجتماعية', 'max': 40},
    {'key': ' (60) رياضيات', 'label': 'رياضيات', 'max': 60},
    {'key': ' (40) علوم', 'label': 'علوم', 'max': 40},
    {'key': ' (40) تربية دينية', 'label': 'تربية دينية', 'max': 40},
    {'key': ' (20) رسم', 'label': 'رسم', 'max': 20},
    {'key': '(20) كمبيوتر', 'label': 'كمبيوتر', 'max': 20},
    {'key': ' (50) لغة اجنبية اولى(مستوى)', 'label': 'لغة أجنبية (مستوى)', 'max': 50},
    {'key': ' (40) لغة اجنبية ثانية', 'label': 'لغة أجنبية ثانية', 'max': 40},
  ];

  const gradesHtml = subjectCols.map(sub => {
    const val = s[sub.key] || '—';
    return `<div class="grade-item">
      <div class="grade-subject">${sub.label} / ${sub.max}</div>
      <div class="grade-score">${val}</div>
    </div>`;
  }).join('');

  const total = s[' (280) مجموع آخر العام'] || '—';
  const note = s['ملحوظة هامة'] || '';

  const html = `
  <div class="result-card">
    <div class="result-header">
      <div class="student-name-result">${s['اسم الطالب'] || ''}</div>
      <div class="result-badge ${isPass ? 'badge-pass' : 'badge-fail'}">${isPass ? '✅ ناجح' : '❌ راسب'}</div>
    </div>
    <div class="result-body">

      <div class="info-grid">
        <div class="info-item">
          <div class="info-label">الرقم القومي</div>
          <div class="info-value" style="direction:ltr;font-size:13px">${s['الرقم القومى'] || ''}</div>
        </div>
        <div class="info-item">
          <div class="info-label">رقم الجلوس</div>
          <div class="info-value">${s['رقم الجلوس'] || ''}</div>
        </div>
        <div class="info-item">
          <div class="info-label">الصف</div>
          <div class="info-value">${s['كود الصف'] || ''}</div>
        </div>
        <div class="info-item">
          <div class="info-label">المدرسة</div>
          <div class="info-value" style="font-size:12px">${s['اسم المدرسة'] || ''}</div>
        </div>
      </div>

      <div class="section-title">الدرجات</div>
      <div class="grades-grid">${gradesHtml}</div>

      <div class="total-row">
        <div class="total-label">المجموع الكلي (من 280)</div>
        <div class="total-value">${total}</div>
      </div>

      ${note ? `<div class="note-box">⚠️ ${note}</div>` : ''}

      <div class="officials-row">
        <div class="official-item">رئيس الكنترول: <span>${s['رئيس الكنترول'] || ''}</span></div>
        <div class="official-item">مديرة القسم الإعدادي: <span>${s['مديرة القسم الااعدادي'] || ''}</span></div>
      </div>

    </div>
  </div>`;

  const resultArea = document.getElementById('result-area');
  resultArea.innerHTML = html;
  resultArea.style.display = 'block';
  resultArea.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// Allow Enter key
document.getElementById('nationalId').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') searchStudent();
});
